[package]
name = "cas-external-radar"
version = "1.11.0"
edition = "2021"
rust-version = "1.85"
description = "Standalone read-only external CS2 radar with browser dashboard and native Win32 mini radar"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = true }
rand = "0.8"
png = "0.17.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
